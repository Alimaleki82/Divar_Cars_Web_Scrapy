networks:
  data_pipeline_network:
    driver: bridge

services:
  divar_kafka:
    image: apache/kafka:4.3.1
    container_name: divar_kafka

    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://divar_kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@divar_kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - data_pipeline_network

  cars_data_mongodb:
    image: mongo:8
    container_name: cars_data_mongodb

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_EXTERNAL_PORT}:27017"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    volumes:
      - mongo_data:/data/db

    networks:
      - data_pipeline_network

  divar_producer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: divar_producer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: divar_kafka:9092

    depends_on:
      divar_kafka:
        condition: service_healthy

    networks:
      - data_pipeline_network

    shm_size: "1gb"

  divar_consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer

    container_name: divar_consumer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: divar_kafka:9092
      MONGO_URI: "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@cars_data_mongodb:27017/${MONGO_DATABASE}?authSource=admin"

    depends_on:
      divar_kafka:
        condition: service_healthy
      cars_data_mongodb:
        condition: service_healthy

    networks:
      - data_pipeline_network

volumes:
  kafka_data:
  mongo_data:
